<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indic to English Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="appTitle">Manglish Converter</h1>
        
        <div class="tabs">
            <button id="tabMalayalam" class="tab active">Malayalam</button>
            <button id="tabTamil" class="tab">Tamil</button>
        </div>

        <textarea id="indicInput" placeholder="മലയാളം ഇവിടെ ടൈപ്പ് ചെയ്യുക..."></textarea>
        <button id="convertBtn">Convert</button>
        <textarea id="englishOutput" placeholder="Output will appear here..." readonly></textarea>
    </div>
    <script src="script.js"></script>
</body>
</html>
